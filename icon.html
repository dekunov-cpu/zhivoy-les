<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Живой Лес</title>
<link rel="apple-touch-icon" href="icon.html">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Живой Лес">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden}
body{
  background:linear-gradient(145deg,#E8C76A 0%,#C9A84C 45%,#A07828 100%);
  display:flex;align-items:center;justify-content:center;
  min-height:100vh;
}
.inner{text-align:center;position:relative;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center}
/* Блик сверху */
.inner::before{
  content:'';position:absolute;top:0;left:0;right:0;height:45%;
  background:linear-gradient(to bottom,rgba(255,255,255,0.18) 0%,transparent 100%);
}
/* Силуэт леса снизу */
.forest{position:absolute;bottom:0;left:0;right:0;height:38%}
.text-les{
  font-family:Georgia,'Times New Roman',serif;
  font-size:28vw;
  font-weight:300;
  color:#1E1209;
  opacity:0.85;
  letter-spacing:0.05em;
  line-height:0.85;
  position:relative;z-index:2;
  margin-bottom:4vw;
}
.text-zhivoy{
  font-family:Georgia,serif;
  font-size:4.5vw;
  letter-spacing:0.5em;
  color:#1E1209;
  opacity:0.4;
  text-transform:uppercase;
  position:relative;z-index:2;
}
.line{
  width:20vw;height:1px;
  background:#1E1209;opacity:0.2;
  margin:3vw auto;
  position:relative;z-index:2;
}
/* Redirect after 0.5s */
</style>
</head>
<body>
<div class="inner">
  <svg class="forest" viewBox="0 0 375 140" preserveAspectRatio="xMidYMax slice" fill="#1E1209" opacity="0.22" xmlns="http://www.w3.org/2000/svg">
    <path d="M0 140 L0 98 L16 72 L32 98 L40 78 L56 48 L72 78 L78 60 L94 30 L110 60 L116 44 L132 16 L148 44 L154 28 L170 52 L180 36 L196 62 L206 46 L222 70 L230 54 L246 26 L262 54 L268 38 L284 64 L294 48 L310 72 L320 56 L336 80 L346 64 L362 88 L375 74 L375 140Z"/>
  </svg>
  <div class="text-les">ЛЕС</div>
  <div class="line"></div>
  <div class="text-zhivoy">ЖИВОЙ</div>
</div>
<script>
// Redirect to main site after being saved as shortcut
if(window.navigator.standalone){
  setTimeout(()=>{window.location.href='retrit-na-prirode.html'},100);
}
</script>
</body>
</html>
